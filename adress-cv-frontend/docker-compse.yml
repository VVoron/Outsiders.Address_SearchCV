version: "3.9"

services:
  frontend-build:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app:rw
      - /var/www/adress-cv-frontend:/out:rw
    environment:
      - CI=true
    command: >
      sh -c "
        corepack enable &&
        npm ci &&
        npx ng build --configuration production --output-path /out
      "
