<kendo-grid
  [kendoGridBinding]="data"
  [pageable]="true"
  [selectable]="{ enabled: true, mode: 'multiple' }"
  [resizable]="true"
  [sortable]="true"
  (selectionChange)="onSelectionChange($event)"
>

    <kendo-grid-checkbox-column [width]="60" [resizable]="false" [showSelectAll]="true">
    </kendo-grid-checkbox-column>

    <kendo-grid-column field="id" title="ID" [width]="60"></kendo-grid-column>

    <kendo-grid-column field="login" title="Логин" [width]="150"></kendo-grid-column>

    <kendo-grid-column field="name" title="Имя" [width]="120"></kendo-grid-column>

    <kendo-grid-column field="role" title="Роль" [width]="80"></kendo-grid-column>
</kendo-grid>
