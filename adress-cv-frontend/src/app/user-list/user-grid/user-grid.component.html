<kendo-grid
  [kendoGridBinding]="data"
  [pageable]="{ buttonCount: 5, info: true, pageSizes: [10, 20, 50], previousNext: true }"
  [pageSize]="pageSize"
  [skip]="skip"
  [loading]="loading"
  [selectable]="{ enabled: true, mode: 'multiple' }"
  [resizable]="true"
  [sortable]="true"
  (selectionChange)="onSelectionChange($event)"
>

    <kendo-grid-checkbox-column [width]="20" [resizable]="false" [showSelectAll]="true">
    </kendo-grid-checkbox-column>

    <kendo-grid-column field="id" title="ID" [width]="60"></kendo-grid-column>

    <kendo-grid-column field="name" title="Логин" [width]="120"></kendo-grid-column>

    <kendo-grid-column field="email" title="email" [width]="150"></kendo-grid-column>

    <kendo-grid-column field="role" title="Роль" [width]="80"></kendo-grid-column>

    <kendo-grid-messages
    pagerItemsPerPage="Элементов на странице"
    pagerItems="элементов"
    pagerOf="из"
    pagerPage="Страница"
    pagerFirstPage="Первая страница"
    pagerPreviousPage="Предыдущая"
    pagerNextPage="Следующая"
    pagerLastPage="Последняя"
    pagerInputLabel="Номер страницы"
  >
  </kendo-grid-messages>
</kendo-grid>
